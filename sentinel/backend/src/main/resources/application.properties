spring.application.name=sentinel-backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=Sentinel;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:AyushSystem}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourpassword}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Execute schema.sql on startup
spring.sql.init.mode=always
