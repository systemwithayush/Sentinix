geometry:
  edge_threshold1: 50
  edge_threshold2: 150
  hough_threshold: 50
  min_line_length: 30
  max_line_gap: 10
  corner_quality: 0.01
  corner_min_dist: 10
  weights:
    lineDensity: 0.2
    parallelLineRatio: 0.3
    rightAngleRatio: 0.3
    rectangularity: 0.1
    symmetryScore: 0.1
    cornerDensity: 0.1
    naturalOrientationEntropy: -0.1
texture:
  z_score_threshold: 1.5
  patch_size: 64
  step_size: 32
  lbp_radius: 3
  lbp_points: 24
  glcm_distances: [1]
  glcm_angles: [0, 0.785, 1.57, 2.356]
temporal:
  ssim_threshold: 0.8
  registration_min_matches: 10
  registration_confidence_threshold: 0.7
  pixel_diff_threshold: 30
fusion:
  iou_threshold: 0.3
vegetation:
  density_threshold: 0.5
  continuity_threshold: 0.6
  texture_deviation_threshold: 0.4
shadow:
  length_threshold: 20
  persistence_threshold: 0.8
  sharpness_threshold: 10
context:
  isolation_threshold: 0.7
  clustering_threshold: 0.5
